[package]
name = "ullm-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
autoexamples = false

[features]
default = []
rocm-ck-gfx1201 = ["ullm-runtime-sys/rocm-ck-gfx1201"]
rocm-ck-gfx942-aprime = ["ullm-runtime-sys/rocm-ck-gfx942-aprime"]

[dependencies]
memchr = "2.7"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ullm-runtime-sys = { path = "../ullm-runtime-sys" }

[[bin]]
name = "ullm-sq8-worker"
path = "src/bin/ullm-sq8-worker.rs"
required-features = ["rocm-ck-gfx1201"]

[[bin]]
name = "ullm-aq4-worker"
path = "src/bin/ullm-aq4-worker.rs"

[[bin]]
name = "ullm-aq4-p2-full-model"
path = "src/bin/ullm-aq4-p2-full-model.rs"

[[bin]]
name = "ullm-aq4-p2-path-oracle"
path = "src/bin/ullm-aq4-p2-path-oracle.rs"

[[bin]]
name = "ullm-aq4-p2-calibration"
path = "src/bin/ullm-aq4-p2-calibration.rs"

[[bin]]
name = "ullm-aq4-differential-trace"
path = "src/bin/ullm-aq4-differential-trace.rs"

[[bin]]
name = "ullm-aq4-p2-resident-driver"
path = "src/bin/ullm-aq4-p2-resident-driver.rs"

[[example]]
name = "sq8_ck_layer"
required-features = ["rocm-ck-gfx1201"]

[[example]]
name = "sq8_ck_full_model"
required-features = ["rocm-ck-gfx1201"]

[[example]]
name = "sq8_ck_generate"
required-features = ["rocm-ck-gfx1201"]

[[example]]
name = "sq8_ck_serving"
required-features = ["rocm-ck-gfx1201"]

[[example]]
name = "sq8_gfx942_aprime_physical_smoke"
required-features = ["rocm-ck-gfx942-aprime"]

[[example]]
name = "sq8_optimized_fixture"

[[example]]
name = "sq8_fnuz_prepack_scan"

[[example]]
name = "sq8_reference_batch_bench"

[[example]]
name = "sq8_reference_linear"

[[example]]
name = "verify_sq8_canonical"
