[package]
name = "sllm-hip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe Rust wrapper and Phase 1 host probe for the sLLM HIP ABI"

[[bin]]
name = "sllm-rmsnorm-g2-evidence"
path = "src/bin/sllm-rmsnorm-g2-evidence.rs"

[[bin]]
name = "sllm-rmsnorm-p0-evidence"
path = "src/bin/sllm-rmsnorm-p0-evidence.rs"

[[bin]]
name = "sllm-execution-transfer-g1-evidence"
path = "src/bin/sllm-execution-transfer-g1-evidence.rs"

[[bin]]
name = "sllm-weight-upload-g1-evidence"
path = "src/bin/sllm-weight-upload-g1-evidence.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sllm-core.workspace = true
sllm-hip-sys.workspace = true

[dev-dependencies]
static_assertions = "1.1.0"
