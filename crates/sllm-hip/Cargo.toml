[package]
name = "sllm-hip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe Rust wrapper and Phase 1 host probe for the sLLM HIP ABI"

[features]
default = []
phase54-research = ["sllm-core/phase54-research"]

[[bin]]
name = "sllm-rmsnorm-g2-evidence"
path = "src/bin/sllm-rmsnorm-g2-evidence.rs"

[[bin]]
name = "sllm-rmsnorm-p0-evidence"
path = "src/bin/sllm-rmsnorm-p0-evidence.rs"

[[bin]]
name = "sllm-execution-transfer-g1-evidence"
path = "src/bin/sllm-execution-transfer-g1-evidence.rs"

[[bin]]
name = "sllm-weight-upload-g1-evidence"
path = "src/bin/sllm-weight-upload-g1-evidence.rs"

[[bin]]
name = "sllm-elementwise-g1-evidence"
path = "src/bin/sllm-elementwise-g1-evidence.rs"

[[bin]]
name = "sllm-embedding-g1-evidence"
path = "src/bin/sllm-embedding-g1-evidence.rs"

[[bin]]
name = "sllm-matmul-g1-evidence"
path = "src/bin/sllm-matmul-g1-evidence.rs"

[[bin]]
name = "sllm-fp8-matmul-evidence"
path = "src/bin/sllm-fp8-matmul-evidence.rs"

[[bin]]
name = "sllm-fp8-qwen-accuracy-evidence"
path = "src/bin/sllm-fp8-qwen-accuracy-evidence.rs"

[[bin]]
name = "sllm-attention-preprocess-g1-evidence"
path = "src/bin/sllm-attention-preprocess-g1-evidence.rs"

[[bin]]
name = "sllm-kv-state-g1-evidence"
path = "src/bin/sllm-kv-state-g1-evidence.rs"

[[bin]]
name = "sllm-full-attention-g1-evidence"
path = "src/bin/sllm-full-attention-g1-evidence.rs"

[[bin]]
name = "sllm-output-gate-g1-evidence"
path = "src/bin/sllm-output-gate-g1-evidence.rs"

[[bin]]
name = "sllm-qwen-d2-evidence"
path = "src/bin/sllm-qwen-d2-evidence.rs"

[[bin]]
name = "sllm-qwen35-moe-admission"
path = "src/bin/sllm-qwen35-moe-admission.rs"

[[bin]]
name = "sllm-qwen35-adapter-evidence"
path = "src/bin/sllm-qwen35-adapter-evidence.rs"

[[bin]]
name = "sllm-qwen35-quality-baseline"
path = "src/bin/sllm-qwen35-quality-baseline.rs"

[[bin]]
name = "sllm-qwen35-kv-quality-probe"
path = "src/bin/sllm-qwen35-kv-quality-probe.rs"

[[bin]]
name = "sllm-kv-mxfp8-e4-evidence"
path = "src/bin/sllm-kv-mxfp8-e4-evidence.rs"

[[bin]]
name = "sllm-qwen35-kv-quality-candidate"
path = "src/bin/sllm-qwen35-kv-quality-candidate.rs"

[[bin]]
name = "sllm-qwen35-kv-quality-research"
path = "src/bin/sllm-qwen35-kv-quality-research.rs"

[[bin]]
name = "sllm-qwen35-kv-attribution-research"
path = "src/bin/sllm-qwen35-kv-attribution-research.rs"
required-features = ["phase54-research"]

[[bin]]
name = "sllm-kv-fp8-block16-research-evidence"
path = "src/bin/sllm-kv-fp8-block16-research-evidence.rs"
required-features = ["phase54-research"]

[[bin]]
name = "sllm-mxfp4-w4a4-evidence"
path = "src/bin/sllm-mxfp4-w4a4-evidence.rs"

[[bin]]
name = "sllm-ministral3-logits-evidence"
path = "src/bin/sllm-ministral3-logits-evidence.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sllm-core.workspace = true
sllm-hip-sys.workspace = true
sllm-frontend.workspace = true

[dev-dependencies]
static_assertions = "1.1.0"
