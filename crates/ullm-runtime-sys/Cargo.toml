[package]
name = "ullm-runtime-sys"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
links = "ullm_runtime"

[features]
default = []
rocm-ck-gfx1201 = []
rocm-handwritten-projection-gfx1201 = ["rocm-ck-gfx1201"]
rocm-ck-gfx942-aprime = []
# Independent F32-only correctness control.  It deliberately has no CK,
# WMMA, or production runtime feature dependency.
rocm-fp32-reference-gfx1201 = []

[build-dependencies]
cc = "1.2"

[[example]]
name = "sq8_ck_fixture"
required-features = ["rocm-ck-gfx1201"]
