# This workflow is intentionally non-required; it is outside host-required branch protection.
name: h3-compile-only (non-required)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  H3_IMAGE_REFERENCE: docker.io/rocm/dev-ubuntu-24.04@sha256:439edaa8f0c4be4a3728e528f87b8a2ea1f051f34cf10b27caa4bd94f562eda7
  H3_IMAGE_MANIFEST_DIGEST: sha256:439edaa8f0c4be4a3728e528f87b8a2ea1f051f34cf10b27caa4bd94f562eda7
  H3_IMAGE_CONFIG_DIGEST: sha256:4c91c0d850e38a40fd669dd043ab42e9bad9a2b8a38e3f873c5a4eaced9f28cf

jobs:
  h3-gfx1030:
    name: h3-gfx1030 compile-only (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare private row output
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1030"
          test -w "$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1030"
      - name: Pull and run pinned ROCm compiler container
        env:
          REVIEWED_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          SLLM_H3_NETWORK_DISABLED: "1"
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          test "$(command -v git)" = /usr/bin/git
          git --version
          docker pull "$H3_IMAGE_REFERENCE"
          test "$(docker image inspect --format '{{.Id}}' "$H3_IMAGE_REFERENCE")" = "$H3_IMAGE_CONFIG_DIGEST"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$H3_IMAGE_REFERENCE" | grep -F -- "$H3_IMAGE_MANIFEST_DIGEST" >/dev/null
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1030,dst=/output" \
            --mount "type=bind,src=/usr/bin/git,dst=/usr/local/bin/git,readonly" \
            --env HOME=/tmp/h3-home \
            --env REVIEWED_SHA --env TESTED_SHA --env WORKFLOW_SHA \
            --env RUN_ID --env RUN_ATTEMPT \
            --env SLLM_H3_NETWORK_DISABLED --env H3_IMAGE_REFERENCE --env H3_IMAGE_CONFIG_DIGEST \
            --workdir /workspace \
            "$H3_IMAGE_REFERENCE" /bin/bash -eu -o pipefail -c '
              mkdir -p "$HOME"
              git config --global --add safe.directory /workspace
              exec python3 ci/tools/run_h3_compile.py \
                --row h3-gfx1030 --repo /workspace --output-dir /output \
                --strict-ci --pinned-container \
                --observed-image-reference "$H3_IMAGE_REFERENCE" \
                --observed-image-config-digest "$H3_IMAGE_CONFIG_DIGEST" \
                --reviewed-sha "$REVIEWED_SHA" --tested-sha "$TESTED_SHA" \
                --workflow-sha "$WORKFLOW_SHA" \
                --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
            '
          if find "$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1030" -mindepth 1 -maxdepth 1 -type f \( ! -uid "$(id -u)" -o ! -gid "$(id -g)" \) -print -quit | grep -q .; then
            echo "H3 container output ownership does not match the GitHub runner user" >&2
            exit 1
          fi
      - name: Upload h3-gfx1030 report, metadata, artifact and sidecars
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: h3-gfx1030
          path: .local-artifacts/h3/h3-gfx1030/*
          if-no-files-found: error
          retention-days: 7

  h3-gfx1201:
    name: h3-gfx1201 compile-only (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare private row output
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1201"
          test -w "$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1201"
      - name: Pull and run pinned ROCm compiler container
        env:
          REVIEWED_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          SLLM_H3_NETWORK_DISABLED: "1"
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          test "$(command -v git)" = /usr/bin/git
          git --version
          docker pull "$H3_IMAGE_REFERENCE"
          test "$(docker image inspect --format '{{.Id}}' "$H3_IMAGE_REFERENCE")" = "$H3_IMAGE_CONFIG_DIGEST"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$H3_IMAGE_REFERENCE" | grep -F -- "$H3_IMAGE_MANIFEST_DIGEST" >/dev/null
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1201,dst=/output" \
            --mount "type=bind,src=/usr/bin/git,dst=/usr/local/bin/git,readonly" \
            --env HOME=/tmp/h3-home \
            --env REVIEWED_SHA --env TESTED_SHA --env WORKFLOW_SHA \
            --env RUN_ID --env RUN_ATTEMPT \
            --env SLLM_H3_NETWORK_DISABLED --env H3_IMAGE_REFERENCE --env H3_IMAGE_CONFIG_DIGEST \
            --workdir /workspace \
            "$H3_IMAGE_REFERENCE" /bin/bash -eu -o pipefail -c '
              mkdir -p "$HOME"
              git config --global --add safe.directory /workspace
              exec python3 ci/tools/run_h3_compile.py \
                --row h3-gfx1201 --repo /workspace --output-dir /output \
                --strict-ci --pinned-container \
                --observed-image-reference "$H3_IMAGE_REFERENCE" \
                --observed-image-config-digest "$H3_IMAGE_CONFIG_DIGEST" \
                --reviewed-sha "$REVIEWED_SHA" --tested-sha "$TESTED_SHA" \
                --workflow-sha "$WORKFLOW_SHA" \
                --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
            '
          if find "$GITHUB_WORKSPACE/.local-artifacts/h3/h3-gfx1201" -mindepth 1 -maxdepth 1 -type f \( ! -uid "$(id -u)" -o ! -gid "$(id -g)" \) -print -quit | grep -q .; then
            echo "H3 container output ownership does not match the GitHub runner user" >&2
            exit 1
          fi
      - name: Upload h3-gfx1201 report, metadata, artifact and sidecars
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: h3-gfx1201
          path: .local-artifacts/h3/h3-gfx1201/*
          if-no-files-found: error
          retention-days: 7

  h3-aggregate:
    name: h3 aggregate (non-required)
    if: ${{ always() }}
    needs: [h3-gfx1030, h3-gfx1201]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate exact needs input
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          mkdir -p .local-artifacts/h3
          printf '%s\n' "$NEEDS_JSON" > .local-artifacts/h3-needs.json
      - name: Download h3-gfx1030 artifact
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: h3-gfx1030
          path: .local-artifacts/h3/h3-gfx1030
      - name: Download h3-gfx1201 artifact
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: h3-gfx1201
          path: .local-artifacts/h3/h3-gfx1201
      - name: Aggregate H3 results fail-closed
        if: ${{ always() }}
        run: >-
          python3 ci/tools/aggregate_h3_results.py
          --needs-json .local-artifacts/h3-needs.json
          --artifact-dir .local-artifacts/h3
          --output-dir .local-artifacts/h3-aggregate
          --strict-ci
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --expected-reviewed-sha "${{ github.sha }}"
          --expected-tested-sha "${{ github.sha }}"
          --expected-workflow-sha "${{ github.sha }}"
      - name: Upload final H3 aggregate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: h3-aggregate
          path: |
            .local-artifacts/h3-aggregate/aggregate.json
            .local-artifacts/h3-aggregate/aggregate.json.sha256
          if-no-files-found: error
          retention-days: 7
