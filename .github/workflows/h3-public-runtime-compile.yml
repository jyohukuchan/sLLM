# This workflow is intentionally non-required; it is compile-only evidence and
# does not establish GPU support, numerics, performance, or executable runtime evidence.
name: h3-public-runtime-compile-only (non-required)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  H3_PUBLIC_RUNTIME_IMAGE_REFERENCE: docker.io/rocm/dev-ubuntu-24.04@sha256:439edaa8f0c4be4a3728e528f87b8a2ea1f051f34cf10b27caa4bd94f562eda7
  H3_PUBLIC_RUNTIME_IMAGE_MANIFEST_DIGEST: sha256:439edaa8f0c4be4a3728e528f87b8a2ea1f051f34cf10b27caa4bd94f562eda7
  H3_PUBLIC_RUNTIME_IMAGE_CONFIG_DIGEST: sha256:4c91c0d850e38a40fd669dd043ab42e9bad9a2b8a38e3f873c5a4eaced9f28cf

jobs:
  h3-public-runtime:
    name: h3 public-runtime compile-only (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare private public-H3 directories
        run: |
          set -eu
          ARTIFACT_ROOT="$GITHUB_WORKSPACE/.local-artifacts"
          ROW_ROOT="$ARTIFACT_ROOT/h3-public-runtime"
          ROW1030="$ROW_ROOT/h3-public-gfx1030"
          ROW1201="$ROW_ROOT/h3-public-gfx1201"
          AGGREGATE_ROOT="$ARTIFACT_ROOT/h3-public-runtime-aggregate"
          NEEDS_PATH="$ARTIFACT_ROOT/h3-public-runtime-needs.json"
          if [ -e "$ARTIFACT_ROOT" ] || [ -L "$ARTIFACT_ROOT" ]; then
            test -d "$ARTIFACT_ROOT"
            test ! -L "$ARTIFACT_ROOT"
          else
            mkdir -m 700 "$ARTIFACT_ROOT"
          fi
          test ! -e "$ROW_ROOT"
          test ! -L "$ROW_ROOT"
          test ! -e "$ROW1030"
          test ! -L "$ROW1030"
          test ! -e "$ROW1201"
          test ! -L "$ROW1201"
          test ! -e "$AGGREGATE_ROOT"
          test ! -L "$AGGREGATE_ROOT"
          test ! -e "$NEEDS_PATH"
          test ! -L "$NEEDS_PATH"
          mkdir -m 700 "$ROW_ROOT"
          mkdir -m 700 "$ROW1030"
          mkdir -m 700 "$ROW1201"
          mkdir -m 700 "$AGGREGATE_ROOT"
          for path in "$ROW_ROOT" "$ROW1030" "$ROW1201" "$AGGREGATE_ROOT"; do
            test -d "$path"
            test ! -L "$path"
            test "$(stat -c '%u:%g' "$path")" = "$(id -u):$(id -g)"
            test "$(stat -c '%a' "$path")" = 700
          done

      - name: Verify immutable identity and pinned image
        env:
          REVIEWED_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(command -v git)" = /usr/bin/git
          git --version
          TREE_OID="$(git rev-parse HEAD^{tree})"
          export TREE_OID
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_OID"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          docker pull "$H3_PUBLIC_RUNTIME_IMAGE_REFERENCE"
          test "$(docker image inspect --format '{{.Id}}' "$H3_PUBLIC_RUNTIME_IMAGE_REFERENCE")" = "$H3_PUBLIC_RUNTIME_IMAGE_CONFIG_DIGEST"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$H3_PUBLIC_RUNTIME_IMAGE_REFERENCE" | grep -F -- "$H3_PUBLIC_RUNTIME_IMAGE_MANIFEST_DIGEST" >/dev/null

      - name: Compile, link, extract, and inspect gfx1030
        env:
          REVIEWED_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SLLM_H3_NETWORK_DISABLED: "1"
        run: |
          set -eu
          TREE_OID="$(git rev-parse HEAD^{tree})"
          export TREE_OID
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_OID"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.local-artifacts/h3-public-runtime/h3-public-gfx1030,dst=/output" \
            --mount "type=bind,src=/usr/bin/git,dst=/usr/local/bin/git,readonly" \
            --env HOME=/tmp/h3-public-runtime-home \
            --env REVIEWED_SHA --env TESTED_SHA --env WORKFLOW_SHA --env TREE_OID \
            --env RUN_ID --env RUN_ATTEMPT --env SLLM_H3_NETWORK_DISABLED \
            --env H3_PUBLIC_RUNTIME_IMAGE_REFERENCE --env H3_PUBLIC_RUNTIME_IMAGE_CONFIG_DIGEST \
            --workdir /workspace \
            "$H3_PUBLIC_RUNTIME_IMAGE_REFERENCE" /bin/bash -eu -o pipefail -c '
              mkdir -p "$HOME"
              git config --global --add safe.directory /workspace
              exec python3 ci/tools/run_h3_public_runtime_compile.py \
                --row h3-public-gfx1030 --repo /workspace --output-dir /output \
                --strict-ci --pinned-container \
                --observed-image-reference "$H3_PUBLIC_RUNTIME_IMAGE_REFERENCE" \
                --observed-image-config-digest "$H3_PUBLIC_RUNTIME_IMAGE_CONFIG_DIGEST" \
                --reviewed-sha "$REVIEWED_SHA" --tested-sha "$TESTED_SHA" \
                --workflow-sha "$WORKFLOW_SHA" --tree-oid "$TREE_OID" \
                --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
            '
          if find "$GITHUB_WORKSPACE/.local-artifacts/h3-public-runtime/h3-public-gfx1030" -xdev -type l -print -quit | grep -q .; then
            echo "H3 public-runtime output contains a symlink" >&2
            exit 1
          fi
          if find "$GITHUB_WORKSPACE/.local-artifacts/h3-public-runtime/h3-public-gfx1030" -xdev \( ! -uid "$(id -u)" -o ! -gid "$(id -g)" \) -print -quit | grep -q .; then
            echo "H3 public-runtime container output ownership does not match the GitHub runner user" >&2
            exit 1
          fi

      - name: Compile, link, extract, and inspect gfx1201
        env:
          REVIEWED_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SLLM_H3_NETWORK_DISABLED: "1"
        run: |
          set -eu
          TREE_OID="$(git rev-parse HEAD^{tree})"
          export TREE_OID
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_OID"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.local-artifacts/h3-public-runtime/h3-public-gfx1201,dst=/output" \
            --mount "type=bind,src=/usr/bin/git,dst=/usr/local/bin/git,readonly" \
            --env HOME=/tmp/h3-public-runtime-home \
            --env REVIEWED_SHA --env TESTED_SHA --env WORKFLOW_SHA --env TREE_OID \
            --env RUN_ID --env RUN_ATTEMPT --env SLLM_H3_NETWORK_DISABLED \
            --env H3_PUBLIC_RUNTIME_IMAGE_REFERENCE --env H3_PUBLIC_RUNTIME_IMAGE_CONFIG_DIGEST \
            --workdir /workspace \
            "$H3_PUBLIC_RUNTIME_IMAGE_REFERENCE" /bin/bash -eu -o pipefail -c '
              mkdir -p "$HOME"
              git config --global --add safe.directory /workspace
              exec python3 ci/tools/run_h3_public_runtime_compile.py \
                --row h3-public-gfx1201 --repo /workspace --output-dir /output \
                --strict-ci --pinned-container \
                --observed-image-reference "$H3_PUBLIC_RUNTIME_IMAGE_REFERENCE" \
                --observed-image-config-digest "$H3_PUBLIC_RUNTIME_IMAGE_CONFIG_DIGEST" \
                --reviewed-sha "$REVIEWED_SHA" --tested-sha "$TESTED_SHA" \
                --workflow-sha "$WORKFLOW_SHA" --tree-oid "$TREE_OID" \
                --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
            '
          if find "$GITHUB_WORKSPACE/.local-artifacts/h3-public-runtime/h3-public-gfx1201" -xdev -type l -print -quit | grep -q .; then
            echo "H3 public-runtime output contains a symlink" >&2
            exit 1
          fi
          if find "$GITHUB_WORKSPACE/.local-artifacts/h3-public-runtime/h3-public-gfx1201" -xdev \( ! -uid "$(id -u)" -o ! -gid "$(id -g)" \) -print -quit | grep -q .; then
            echo "H3 public-runtime container output ownership does not match the GitHub runner user" >&2
            exit 1
          fi

      - name: Prepare exact public-runtime needs input
        if: ${{ always() }}
        run: |
          set -eu
          NEEDS_PATH="$GITHUB_WORKSPACE/.local-artifacts/h3-public-runtime-needs.json"
          test ! -e "$NEEDS_PATH"
          test ! -L "$NEEDS_PATH"
          umask 077
          printf '%s\n' '{"state":"PASS","rows":["h3-public-gfx1030","h3-public-gfx1201"]}' > "$NEEDS_PATH"
          test -f "$NEEDS_PATH"
          test ! -L "$NEEDS_PATH"
          test "$(stat -c '%u:%g' "$NEEDS_PATH")" = "$(id -u):$(id -g)"
          test "$(stat -c '%a' "$NEEDS_PATH")" = 600

      - name: Aggregate exactly two public-runtime PASS rows locally
        if: ${{ always() }}
        run: >-
          python3 ci/tools/aggregate_h3_public_runtime_results.py
          --needs-json .local-artifacts/h3-public-runtime-needs.json
          --artifact-dir .local-artifacts/h3-public-runtime
          --output-dir .local-artifacts/h3-public-runtime-aggregate
          --strict-ci
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --expected-reviewed-sha "${{ github.sha }}"
          --expected-tested-sha "${{ github.sha }}"
          --expected-workflow-sha "${{ github.sha }}"
          --tree-oid "$(git rev-parse HEAD^{tree})"

      - name: Upload JSON aggregate only
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: h3-public-runtime-aggregate
          path: |
            .local-artifacts/h3-public-runtime-aggregate/aggregate.json
            .local-artifacts/h3-public-runtime-aggregate/aggregate.json.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup generated public-H3 rows and needs
        if: ${{ always() }}
        run: |
          set -eu
          ARTIFACT_ROOT="$GITHUB_WORKSPACE/.local-artifacts"
          ROW1030="$ARTIFACT_ROOT/h3-public-runtime/h3-public-gfx1030"
          ROW1201="$ARTIFACT_ROOT/h3-public-runtime/h3-public-gfx1201"
          NEEDS_PATH="$ARTIFACT_ROOT/h3-public-runtime-needs.json"
          AGGREGATE_ROOT="$ARTIFACT_ROOT/h3-public-runtime-aggregate"
          for path in "$ROW1030" "$ROW1201" "$NEEDS_PATH"; do
            test ! -L "$path"
          done
          if [ -e "$ROW1030" ]; then
            test -d "$ROW1030"
            rm -rf -- "$ROW1030"
          fi
          if [ -e "$ROW1201" ]; then
            test -d "$ROW1201"
            rm -rf -- "$ROW1201"
          fi
          if [ -e "$NEEDS_PATH" ]; then
            test -f "$NEEDS_PATH"
            rm -f -- "$NEEDS_PATH"
          fi
          test ! -e "$ROW1030"
          test ! -L "$ROW1030"
          test ! -e "$ROW1201"
          test ! -L "$ROW1201"
          test ! -e "$NEEDS_PATH"
          test ! -L "$NEEDS_PATH"
          test -f "$AGGREGATE_ROOT/aggregate.json"
          test ! -L "$AGGREGATE_ROOT/aggregate.json"
          test -f "$AGGREGATE_ROOT/aggregate.json.sha256"
          test ! -L "$AGGREGATE_ROOT/aggregate.json.sha256"
