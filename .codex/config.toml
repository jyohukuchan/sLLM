# sLLM: keep bounded subagent work on Luna; custom escalation roles may override.
[agents]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "xhigh"

# Public model, paper, and documentation lookup; no local token is required.
[mcp_servers.huggingface]
url = "https://huggingface.co/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
