# sLLM: the subagent model comes from the active Codex profile.  The default
# OpenAI profile uses Luna (see ~/.codex/config.toml); alternate provider
# profiles such as deepseek-flash set their own default subagent model.

# Public model, paper, and documentation lookup; no local token is required.
[mcp_servers.huggingface]
url = "https://huggingface.co/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
