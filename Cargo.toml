[workspace]
resolver = "3"
members = [
    "crates/sllm-core",
    "crates/sllm-hip-sys",
    "crates/sllm-hip",
    "crates/sllm-cli",
    "crates/sllm-frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150" }
sha2 = { version = "=0.10.9" }
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
sllm-core = { path = "crates/sllm-core" }
sllm-frontend = { path = "crates/sllm-frontend" }
sllm-hip = { path = "crates/sllm-hip" }
sllm-hip-sys = { path = "crates/sllm-hip-sys" }
